[project]
name = "expenses-tracker"
version = "0.1.0"
description = "Expense tracker API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.3",
    "matplotlib>=3.11.2",
    "prettytable>=3.18.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
    "python-telegram-bot>=22.0.0",
]

[tool.setuptools]
py-modules = ["main", "bot"]
